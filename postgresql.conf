# postgresql.conf
#
# PostgreSQL 15 configuration for the Sansbank DAO shared Nostr relay.
# Tuned for the `nostr` VPS (2 vCPU, 3.8 GiB RAM) and the 1 GiB memory cap
# applied to the nostream-db service in docker-compose.yml.
#
# Only non-default values are set here; every unlisted parameter keeps the
# PostgreSQL 15 default. This file is mounted over /postgresql.conf and loaded
# via: postgres -c 'config_file=/postgresql.conf'

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
max_connections = 100

#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------

shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 128MB
dynamic_shared_memory_type = posix
effective_io_concurrency = 200
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
max_parallel_workers = 2

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

random_page_cost = 1.1
effective_cache_size = 768MB
default_statistics_target = 100

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------

log_timezone = 'Etc/UTC'

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
default_text_search_config = 'pg_catalog.english'